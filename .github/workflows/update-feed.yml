# Runs in the public center-point-podcast-feed repository, which is where the live site loads episodes.json from.
# It rebuilds episodes.json from the podcast's RSS feed and saves it if anything changed.
# It can also be started by hand: on GitHub, open the repository's Actions tab, pick this workflow, "Run workflow".
name: Update episode data

on:
  schedule:
    # Thursdays at 1pm in California. GitHub keeps time in UTC and ignores daylight saving, so there are two entries:
    # 20:00 UTC is 1pm in summer and 21:00 UTC is 1pm in winter. Whichever runs second finds nothing to do.
    - cron: '0 20 * * 4'
    - cron: '0 21 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild episodes.json from the RSS feed
        run: node update-feed.js
      - name: Save it if it changed
        run: |
          if [ -z "$(git status --porcelain episodes.json)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes.json
          git commit -m "Update episode data from the RSS feed"
          git push
